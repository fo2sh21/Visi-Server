[package]
name = "opaque-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "opaque-sidecar"
path = "src/main.rs"

[lib]
name = "opaque_sidecar"
path = "src/lib.rs"

[dependencies]
core-crypto = { path = "../core-crypto" }
opaque-ke = { version = "4", features = ["argon2"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
